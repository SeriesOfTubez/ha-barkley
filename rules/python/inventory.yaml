# Inventory: neutral facts about what an integration hooks into. These never become
# findings and never affect the score; they feed the `graph` section of the report.
#
# metadata.sniff.inventory: {ring, kind, relation[, key]}
#   The node key is the interpolated message (e.g. `DOMAIN."refresh"`), cleaned up by
#   the scanner. With a fixed `key`, the message is collected into attrs.values instead
#   (one node per category, not one per call site).
rules:
  - id: inv-service-register
    languages: [python]
    severity: INFO
    message: $D|$N
    metadata: {sniff: {inventory: {ring: ha, kind: service, relation: registers}}}
    pattern-either:
      - pattern: $H.services.async_register($D, $N, ...)
      - pattern: $H.services.register($D, $N, ...)
      - pattern: homeassistant.helpers.service.async_register_admin_service($H, $D, $N, ...)

  - id: inv-entity-service
    languages: [python]
    severity: INFO
    message: $N
    metadata: {sniff: {inventory: {ring: ha, kind: entity_service, relation: registers}}}
    pattern-either:
      - pattern: $P.async_register_entity_service($N, ...)
      - pattern: homeassistant.helpers.service.async_register_platform_entity_service($H, $D, $N, ...)

  - id: inv-service-call
    languages: [python]
    severity: INFO
    message: $D|$S
    metadata: {sniff: {inventory: {ring: ha, kind: service, relation: calls}}}
    pattern-either:
      - pattern: $H.services.async_call($D, $S, ...)
      - pattern: $H.services.call($D, $S, ...)

  - id: inv-http-view
    languages: [python]
    severity: INFO
    message: $V
    metadata: {sniff: {inventory: {ring: ha, kind: http_view, relation: registers}}}
    pattern: $H.http.register_view($V)

  - id: inv-static-path
    languages: [python]
    severity: INFO
    message: static files
    metadata: {sniff: {inventory: {ring: ha, kind: http_static, relation: registers, key: static files}}}
    pattern-either:
      - pattern: $H.http.register_static_path(...)
      - pattern: $H.http.async_register_static_paths(...)

  - id: inv-frontend-js
    languages: [python]
    severity: INFO
    message: $URL
    metadata: {sniff: {inventory: {ring: ha, kind: frontend_js, relation: injects}}}
    pattern-either:
      - pattern: homeassistant.components.frontend.add_extra_js_url($H, $URL, ...)
      - pattern: add_extra_js_url($H, $URL, ...)

  - id: inv-panel
    languages: [python]
    severity: INFO
    message: sidebar panel
    metadata: {sniff: {inventory: {ring: ha, kind: panel, relation: registers, key: sidebar panel}}}
    pattern-either:
      - pattern: homeassistant.components.frontend.async_register_built_in_panel(...)
      - pattern: async_register_built_in_panel(...)
      - pattern: homeassistant.components.panel_custom.async_register_panel(...)

  - id: inv-ws-command
    languages: [python]
    severity: INFO
    message: websocket commands
    metadata: {sniff: {inventory: {ring: ha, kind: ws_command, relation: registers, key: websocket commands}}}
    pattern-either:
      - pattern: homeassistant.components.websocket_api.async_register_command($H, $C, ...)
      - pattern: websocket_api.async_register_command($H, $C, ...)

  - id: inv-webhook
    languages: [python]
    severity: INFO
    message: webhook
    metadata: {sniff: {inventory: {ring: ha, kind: webhook, relation: registers, key: webhook}}}
    pattern: homeassistant.components.webhook.async_register(...)

  - id: inv-event-listen
    languages: [python]
    severity: INFO
    message: $EV
    metadata: {sniff: {inventory: {ring: ha, kind: event, relation: listens}}}
    pattern-either:
      - pattern: $H.bus.async_listen($EV, ...)
      - pattern: $H.bus.async_listen_once($EV, ...)
      - pattern: $H.bus.listen($EV, ...)
      - pattern: $H.bus.listen_once($EV, ...)

  - id: inv-event-fire
    languages: [python]
    severity: INFO
    message: $EV
    metadata: {sniff: {inventory: {ring: ha, kind: event, relation: fires}}}
    pattern-either:
      - pattern: $H.bus.async_fire($EV, ...)
      - pattern: $H.bus.fire($EV, ...)

  - id: inv-state-track
    languages: [python]
    severity: INFO
    message: state changes
    metadata: {sniff: {inventory: {ring: ha, kind: states, relation: tracks, key: state changes}}}
    pattern-either:
      - pattern: homeassistant.helpers.event.async_track_state_change_event(...)
      - pattern: homeassistant.helpers.event.async_track_state_change(...)
      - pattern: homeassistant.helpers.event.async_track_state_added_domain(...)
      - pattern: async_track_state_change_event(...)
      - pattern: async_track_state_change(...)

  - id: inv-state-read
    languages: [python]
    severity: INFO
    message: entity states
    metadata: {sniff: {inventory: {ring: ha, kind: states, relation: reads, key: entity states}}}
    pattern-either:
      - pattern: $H.states.get(...)
      - pattern: $H.states.async_entity_ids(...)
      - pattern: $H.states.async_all($X)

  - id: inv-state-read-all
    languages: [python]
    severity: INFO
    message: all entity states
    metadata: {sniff: {inventory: {ring: data, kind: data, relation: reads, key: all entity states}}}
    pattern-either:
      - pattern: $H.states.async_all()
      - pattern: $H.states.all()

  - id: inv-entity-registry
    languages: [python]
    severity: INFO
    message: entity registry
    metadata: {sniff: {inventory: {ring: ha, kind: registry, relation: reads, key: entity registry}}}
    pattern: homeassistant.helpers.entity_registry.async_get(...)

  - id: inv-device-registry
    languages: [python]
    severity: INFO
    message: device registry
    metadata: {sniff: {inventory: {ring: ha, kind: registry, relation: reads, key: device registry}}}
    pattern: homeassistant.helpers.device_registry.async_get(...)

  - id: inv-recorder
    languages: [python]
    severity: INFO
    message: recorder history
    metadata: {sniff: {inventory: {ring: data, kind: data, relation: reads, key: recorder history}}}
    pattern-either:
      - pattern: homeassistant.components.recorder.get_instance(...)
      - pattern: homeassistant.components.recorder.history.$F(...)

  - id: inv-config-entries-all
    languages: [python]
    severity: INFO
    message: config entries of other integrations
    metadata: {sniff: {inventory: {ring: data, kind: data, relation: reads, key: config entries of other integrations}}}
    patterns:
      - pattern-either:
          - pattern: $H.config_entries.async_entries()
          - pattern: $H.config_entries.async_entries($D)
      - pattern-not: $H.config_entries.async_entries(DOMAIN)
      - pattern-not: $H.config_entries.async_entries(self.domain)

  - id: inv-user-lookup
    languages: [python]
    severity: INFO
    message: calling user lookup
    metadata: {sniff: {inventory: {ring: data, kind: auth, relation: reads, key: calling user lookup}}}
    pattern: $H.auth.async_get_user(...)

  - id: inv-env-read
    languages: [python]
    severity: INFO
    message: environment variables
    metadata: {sniff: {inventory: {ring: data, kind: data, relation: reads, key: environment variables}}}
    pattern-either:
      - pattern: os.environ
      - pattern: os.getenv(...)

  - id: inv-http-client
    languages: [python]
    severity: INFO
    message: HTTP client
    metadata: {sniff: {inventory: {ring: network, kind: capability, relation: uses, outbound: true, key: HTTP client}}}
    pattern-either:
      - pattern: homeassistant.helpers.aiohttp_client.async_get_clientsession(...)
      - pattern: homeassistant.helpers.aiohttp_client.async_create_clientsession(...)
      - pattern: homeassistant.helpers.httpx_client.get_async_client(...)
      - pattern: homeassistant.helpers.httpx_client.create_async_httpx_client(...)
      - pattern: aiohttp.ClientSession(...)
      - pattern: aiohttp.request(...)
      - pattern: urllib.request.urlopen(...)
      - pattern: http.client.HTTPConnection(...)
      - pattern: http.client.HTTPSConnection(...)
      - patterns:
          - pattern: requests.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(get|post|put|patch|delete|head|request|Session)$
      - patterns:
          - pattern: httpx.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(get|post|put|patch|delete|request|Client|AsyncClient)$

  - id: inv-socket
    languages: [python]
    severity: INFO
    message: raw sockets
    metadata: {sniff: {inventory: {ring: network, kind: capability, relation: uses, outbound: true, key: raw sockets}}}
    pattern-either:
      - pattern: socket.socket(...)
      - pattern: socket.create_connection(...)
      - pattern: asyncio.open_connection(...)
      - pattern: $LOOP.create_connection(...)
      - pattern: $LOOP.create_datagram_endpoint(...)

  - id: inv-websocket-client
    languages: [python]
    severity: INFO
    message: websocket client
    metadata: {sniff: {inventory: {ring: network, kind: capability, relation: uses, outbound: true, key: websocket client}}}
    pattern-either:
      - pattern: websockets.connect(...)
      - pattern: $S.ws_connect(...)

  - id: inv-mqtt-publish
    languages: [python]
    severity: INFO
    message: MQTT publish
    metadata: {sniff: {inventory: {ring: network, kind: capability, relation: uses, key: MQTT publish}}}
    pattern-either:
      - pattern: homeassistant.components.mqtt.async_publish(...)
      - pattern: homeassistant.components.mqtt.publish(...)

  - id: inv-subprocess
    languages: [python]
    severity: INFO
    message: subprocesses
    metadata: {sniff: {inventory: {ring: ha, kind: capability, relation: uses, key: subprocesses}}}
    pattern-either:
      - pattern: subprocess.$F(...)
      - pattern: asyncio.create_subprocess_exec(...)
      - pattern: asyncio.create_subprocess_shell(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
