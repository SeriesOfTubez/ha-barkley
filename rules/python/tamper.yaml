rules:
  - id: ha-monkeypatch
    languages: [python]
    severity: ERROR
    message: >-
      Replaces attributes on Home Assistant core, the auth system, or the network/TLS
      stack at runtime. That changes behaviour for every integration, and is how
      code hides traffic, steals credentials in flight, or disables TLS checks globally.
    metadata:
      sniff: {title: Monkeypatches core or network stack, severity: high, category: tamper}
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $OBJ.$ATTR = $V
              - pattern: setattr($OBJ, $ATTR, $V)
          - metavariable-regex:
              metavariable: $OBJ
              regex: ^(homeassistant(\.\w+)*|HomeAssistant|socket|socket\.socket|ssl|ssl\.SSLContext|aiohttp(\.\w+)*|ClientSession|TCPConnector|requests(\.\w+)*|urllib3(\.\w+)*|http\.client(\.\w+)*|builtins|(self\.)?_?hass\.(auth|http|bus|states|services|config_entries|loop)(\.\w+)*)$
      - pattern: ssl._create_default_https_context = $V
