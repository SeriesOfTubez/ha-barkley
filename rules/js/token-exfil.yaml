# Frontend cards run in the Home Assistant origin and can read the user's tokens.
rules:
  - id: card-token-exfil
    mode: taint
    languages: [javascript, typescript]
    # (0.14.0) No constant propagation: Semgrep 1.185 doesn't treat a destructured
    # binding as shadowing (`({C}) => fetch(C + "/x")` read C as an outer "/api/…"), so
    # the exclusions below only see literal text. URLs built from names are proven
    # same-origin, or not, by the scan's js_wrapper step (analyzers/js_wrapper.py).
    options:
      symbolic_propagation: true
      constant_propagation: false
    severity: ERROR
    message: >-
      A Home Assistant auth token flows into a network request that is not
      provably same-origin. A card holding your refresh token can act as you
      from anywhere, indefinitely.
    metadata:
      sniff:
        title: Card sends HA auth token off-box
        severity: critical
        category: exfil
        tags: [exfil]
    pattern-sources:
      - pattern: localStorage.getItem("hassTokens")
      - pattern: window.localStorage.getItem("hassTokens")
      # (0.14.0) By shape: storage reached through a global or a variable, and methods
      # named by a computed key (`globalThis["localStorage"]["getItem"](…)`). The scan's
      # js_fold step writes names that were built from pieces back in place first.
      - pattern: $LS.getItem("hassTokens")
      - pattern: $LS["getItem"]("hassTokens")
      - pattern: localStorage["hassTokens"]
      - pattern: $LS["hassTokens"]
      - pattern: localStorage.hassTokens
      - pattern: $LS.hassTokens
      - pattern: $H.auth.data
      - pattern: $H.auth.accessToken
      - pattern: $H.connection.options.auth
      - pattern: $X.access_token
      - pattern: $X.refresh_token
      - pattern: document.cookie
      - pattern: $G.document.cookie
    # (0.15) A blob: address made in the browser never leaves it: opening or showing
    # one sends nothing anywhere (a real panel opened a document it had fetched
    # from HA with the token).
    pattern-sanitizers:
      - pattern: URL.createObjectURL(...)
      - pattern: $G.URL.createObjectURL(...)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: navigator.sendBeacon($URL, ...)
              - pattern: new WebSocket($URL, ...)
              - pattern: new EventSource($URL, ...)
              - pattern: window.open($URL, ...)
              - pattern: $XHR.open($M, $URL, ...)
              - pattern: $IMG.src = $URL
              # (0.14.0) The same calls reached through a global object, with a plain
              # or computed name: `window.fetch(…)`, `globalThis["fetch"](…)`,
              # `self.navigator.sendBeacon(…)`, `new window.WebSocket(…)`.
              - patterns:
                  - pattern-either:
                      - pattern: $G.fetch($URL, ...)
                      - pattern: $G["fetch"]($URL, ...)
                      - pattern: $G.navigator.sendBeacon($URL, ...)
                      - pattern: $G["navigator"]["sendBeacon"]($URL, ...)
                      - pattern: navigator["sendBeacon"]($URL, ...)
                      - pattern: new $G.WebSocket($URL, ...)
                      - pattern: new $G["WebSocket"]($URL, ...)
                      - pattern: new $G.EventSource($URL, ...)
                      - pattern: new $G["EventSource"]($URL, ...)
                      - pattern: $G.open($URL, ...)
                      - pattern: $G["open"]($URL, ...)
                  - metavariable-regex:
                      metavariable: $G
                      regex: ^(window|globalThis|self|top|parent|frames)$
              # A name bound to a global object earlier (`const G = globalThis` at the
              # top, used inside a function): Semgrep's propagation stays inside one
              # function, so the binding is matched by shape here.
              - patterns:
                  - pattern-inside: |
                      $G = $GLOBAL;
                      ...
                  - metavariable-regex:
                      metavariable: $GLOBAL
                      regex: ^(window|globalThis|self|top|parent|frames)$
                  - pattern-either:
                      - pattern: $G.fetch($URL, ...)
                      - pattern: $G["fetch"]($URL, ...)
                      - pattern: $G.navigator.sendBeacon($URL, ...)
                      - pattern: new $G.WebSocket($URL, ...)
                      - pattern: new $G.EventSource($URL, ...)
                      - pattern: $G.open($URL, ...)
          # Relative URLs and hass-built URLs stay on the HA origin. (0.15)
          # `hassUrl(path)` is HA's address with `path` appended, so only a
          # path that starts with "/", "?" or "#" (or none) counts:
          # `hassUrl("@other.host/x")` would move the host. A relative URL
          # starts with "/" and then neither "/" nor "\\" (browsers read "/\\h" as
          # "//h"); anything appended after such a prefix can't change the origin.
          - pattern-not: fetch("=~/^\/[^\/\\]/", ...)
          - pattern-not: fetch("=~/^\/[^\/\\]/".concat(...), ...)
          - pattern-not: fetch("=~/^\/[^\/\\]/" + $Y, ...)
          - pattern-not: fetch($H.hassUrl(), ...)
          - pattern-not: fetch($H.hassUrl("=~/^[\/?#]/"), ...)
          - pattern-not: fetch($H.hassUrl("=~/^[\/?#]/" + $Y), ...)
          - pattern-not: $G.fetch("=~/^\/[^\/\\]/", ...)
          - pattern-not: $G.fetch("=~/^\/[^\/\\]/".concat(...), ...)
          - pattern-not: $G.fetch("=~/^\/[^\/\\]/" + $Y, ...)
          - pattern-not: $G.fetch($H.hassUrl(), ...)
          - pattern-not: $G.fetch($H.hassUrl("=~/^[\/?#]/"), ...)
          - pattern-not: $G.fetch($H.hassUrl("=~/^[\/?#]/" + $Y), ...)
          - pattern-not: $XHR.open($M, "=~/^\/[^\/\\]/", ...)
          - pattern-not: $XHR.open($M, "=~/^\/[^\/\\]/".concat(...), ...)
          - pattern-not: $XHR.open($M, "=~/^\/[^\/\\]/" + $Y, ...)
          - pattern-not: new WebSocket($H.hassUrl(), ...)
          - pattern-not: new WebSocket($H.hassUrl("=~/^[\/?#]/"), ...)
          - pattern-not: new WebSocket($H.hassUrl("=~/^[\/?#]/" + $Y), ...)
      - patterns:
          # Anything sent over an already-open XHR / socket.
          - pattern-either:
              - pattern: $XHR.send($BODY)
              - pattern: $WS.send($BODY)
          - focus-metavariable: $BODY

  - id: card-read-tokens
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Reads the raw HA token store (hassTokens) from localStorage. Cards talk to
      HA through the hass object and never need the stored refresh token.
    metadata:
      sniff: {title: Card reads stored HA tokens, severity: high, category: sensitive_access}
    pattern-either:
      - pattern: '"hassTokens"'
      - pattern: localStorage.hassTokens
      - pattern: window.localStorage.hassTokens

  - id: card-access-token-use
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Reads the user's access token from the hass object. Some cards do this for
      authenticated same-origin requests; check where the token is sent.
    metadata:
      sniff: {title: Card handles the user's access token, severity: medium, category: sensitive_access}
    pattern-either:
      - pattern: $H.auth.data.access_token
      - pattern: $H.auth.data.refresh_token
      - pattern: $H.auth.accessToken
      - pattern: $H.connection.options.auth
