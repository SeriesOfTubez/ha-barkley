rules:
  - id: card-b64-eval
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Decodes an encoded string and executes it. Hiding code this way only makes
      sense if someone doesn't want it read.
    metadata:
      sniff: {title: Card decodes and executes hidden code, severity: critical, category: code_exec, tags: [malware]}
    pattern-sources:
      - pattern: atob(...)
      - pattern: window.atob(...)
      - pattern: Buffer.from($S, "base64")
      - pattern: String.fromCharCode(...)
      - pattern: unescape(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($ARG)
              - pattern: window.eval($ARG)
              - pattern: new Function(..., $ARG)
              - pattern: Function(..., $ARG)
              - pattern: setTimeout($ARG, ...)
              - pattern: setInterval($ARG, ...)
              - pattern: document.write($ARG)
              - pattern: $EL.innerHTML = $ARG
              # (0.14.0) Reached through a global, by plain or computed name.
              - patterns:
                  - pattern-either:
                      - pattern: $G.eval($ARG)
                      - pattern: $G["eval"]($ARG)
                      - pattern: new $G.Function(..., $ARG)
                      - pattern: new $G["Function"](..., $ARG)
                      - pattern: $G.Function(..., $ARG)
                      - pattern: $G["Function"](..., $ARG)
                      - pattern: $G.document.write($ARG)
                      - pattern: $G["document"].write($ARG)
                      - pattern: $G["document"]["write"]($ARG)
                      - pattern: document["write"]($ARG)
                  - metavariable-regex:
                      metavariable: $G
                      regex: ^(window|globalThis|self|top|parent|frames)$
              # A name bound to a global object earlier (`const G = globalThis`).
              - patterns:
                  - pattern-inside: |
                      $G = $GLOBAL;
                      ...
                  - metavariable-regex:
                      metavariable: $GLOBAL
                      regex: ^(window|globalThis|self|top|parent|frames)$
                  - pattern-either:
                      - pattern: $G.eval($ARG)
                      - pattern: $G["eval"]($ARG)
                      - pattern: new $G.Function(..., $ARG)
                      - pattern: $G.Function(..., $ARG)
          - focus-metavariable: $ARG

  # (0.14.0) Code that comes from outside the card: a network response, a message, the
  # URL, cookies or browser storage, reaching eval/Function. That's how a card would run
  # code nobody reviewed. Followed within one function (Semgrep's free engine): code
  # fetched in one function and run in another shows as card-eval (medium), a known limit.
  - id: card-eval-remote
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Runs code that comes from outside the card (a download, a message or browser
      storage). That code was never part of what was scanned, and it runs with the
      logged-in user's full HA access.
    metadata:
      sniff:
        title: Card runs code from outside the card
        severity: high
        category: code_exec
        supersedes: [card-eval]
    # (0.15, full Marketplace run 2026-11-22) Labels: any promise's value counts for eval
    # and Function, but a timer only takes code from a download, a message or storage. A
    # real card handed the unsubscribe function a subscription promise gives to
    # `setTimeout(unsub, 0)`: a function, not code.
    pattern-sources:
      - label: OUTSIDE
        pattern: fetch(...)
      - label: OUTSIDE
        pattern: $G.fetch(...)
      # the value a promise chain hands on: fetch(u).then(r => r.text()).then(code => …)
      - label: OUTSIDE
        patterns:
          - pattern-either:
              - pattern: $F(...).then(($T) => $B)
              - pattern: $F(...).then(function ($T) { ... })
          - metavariable-pattern:
              metavariable: $F
              pattern-either:
                - pattern: <... fetch(...) ...>
                - pattern: <... $G.fetch(...) ...>
          - focus-metavariable: $T
      - label: PROMISE
        patterns:
          - pattern-either:
              - pattern: $F(...).then(($T) => $B)
              - pattern: $F(...).then(function ($T) { ... })
          - focus-metavariable: $T
      - label: OUTSIDE
        pattern: $X.responseText
      - label: OUTSIDE
        pattern: $X.response
      - label: OUTSIDE
        patterns:
          - pattern-either:
              - pattern-inside: $W.addEventListener("message", ($E) => { ... })
              - pattern-inside: $W.addEventListener("message", function ($E) { ... })
              - pattern-inside: $W.onmessage = ($E) => { ... }
              - pattern-inside: $W.onmessage = function ($E) { ... }
          - pattern: $E.data
      - label: OUTSIDE
        pattern: document.cookie
      - label: OUTSIDE
        patterns:
          - pattern: $LS.getItem(...)
          - metavariable-regex:
              metavariable: $LS
              regex: (localStorage|sessionStorage)$
    pattern-sinks:
      - requires: OUTSIDE or PROMISE
        patterns:
          - pattern-either:
              - pattern: eval($ARG)
              - pattern: new Function(..., $ARG)
              - pattern: Function(..., $ARG)
              - patterns:
                  - pattern-either:
                      - pattern: $G.eval($ARG)
                      - pattern: $G["eval"]($ARG)
                      - pattern: new $G.Function(..., $ARG)
                      - pattern: $G.Function(..., $ARG)
                  - metavariable-regex:
                      metavariable: $G
                      regex: ^(window|globalThis|self|top|parent|frames)$
          - focus-metavariable: $ARG
      - requires: OUTSIDE
        patterns:
          - pattern-either:
              - pattern: setTimeout($ARG, ...)
              - pattern: setInterval($ARG, ...)
          - focus-metavariable: $ARG

  # (0.15, his decision 2026-11-21) Code taken from the page address: anyone who gets a
  # logged-in user to open a link can make the card run code. A door someone else can use,
  # not a sign of malice: Exposure 5, not Threat (it was part of card-eval-remote before).
  # analyzers/js_address.py adds the same finding when the address reaches the code
  # through the card's settings.
  - id: card-eval-address
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Runs code taken from the page address. Anyone who gets you to open a link to your
      dashboard can make the card run code there, with your Home Assistant login.
    metadata:
      sniff:
        title: A link can make the card run code
        severity: high
        category: code_exec
        supersedes: [card-eval]
    pattern-sources:
      - pattern: location
      - pattern: $G.location
      - pattern: document.URL
      - pattern: document.referrer
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($ARG)
              - pattern: new Function(..., $ARG)
              - pattern: Function(..., $ARG)
              - pattern: setTimeout($ARG, ...)
              - pattern: setInterval($ARG, ...)
              - patterns:
                  - pattern-either:
                      - pattern: $G.eval($ARG)
                      - pattern: $G["eval"]($ARG)
                      - pattern: new $G.Function(..., $ARG)
                      - pattern: $G.Function(..., $ARG)
                  - metavariable-regex:
                      metavariable: $G
                      regex: ^(window|globalThis|self|top|parent|frames)$
          - focus-metavariable: $ARG

  # (0.14.0) Medium, a Capability: code built at run time from the card's own pieces, or
  # from values Barkley can't trace (charting and template libraries compile code this
  # way; on 9 real cards it was the only high finding). card-eval-remote takes the line
  # when the code comes from outside.
  - id: card-eval
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Builds code while running and executes it. Charting and template libraries do
      this to make their own code fast; it matters where the pieces come from.
    metadata:
      sniff: {title: Card builds code at run time, severity: medium, category: code_exec}
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: eval($X)
              - pattern: window.eval($X)
              - pattern: new Function(..., $X)
              - pattern: Function(..., $X)
              # (0.14.0) Reached through a global, by plain or computed name.
              - patterns:
                  - pattern-either:
                      - pattern: $G.eval($X)
                      - pattern: $G["eval"]($X)
                      - pattern: new $G.Function(..., $X)
                      - pattern: new $G["Function"](..., $X)
                      - pattern: $G.Function(..., $X)
                      - pattern: $G["Function"](..., $X)
                  - metavariable-regex:
                      metavariable: $G
                      regex: ^(window|globalThis|self|top|parent|frames)$
              # A name bound to a global object earlier (`const G = globalThis`).
              - patterns:
                  - pattern-inside: |
                      $G = $GLOBAL;
                      ...
                  - metavariable-regex:
                      metavariable: $GLOBAL
                      regex: ^(window|globalThis|self|top|parent|frames)$
                  - pattern-either:
                      - pattern: $G.eval($X)
                      - pattern: $G["eval"]($X)
                      - pattern: new $G.Function(..., $X)
                      - pattern: $G.Function(..., $X)
          # Literal code (bundler globalThis shims like Function("return this")) is fine.
          - pattern-not: eval("...")
          - pattern-not: window.eval("...")
          - pattern-not: $G.eval("...")
          - pattern-not: $G["eval"]("...")
          - pattern-not: new Function(..., "...")
          - pattern-not: Function(..., "...")
          - pattern-not: new $G.Function(..., "...")
          - pattern-not: $G.Function(..., "...")
          # Bundler shim: Function('return require("' + name + '")')
          - pattern-not: Function("=~/^return require\(/" + $M + "...")
          - pattern-not: new Function("=~/^return require\(/" + $M + "...")
          # (0.15, batch 2026-11-21) Bundled polyfills that build no code a card chooses:
          # a validation library's probe whether the page allows eval at all (empty code);
          - pattern-not: Function(``)
          - pattern-not: new Function(``)
          # a setImmediate polyfill's path for a string callback (it builds code only from
          # what a caller hands it; card-eval-remote and card-eval-config still follow
          # downloaded or configured text into it);
          - pattern-not-inside: '"function" == typeof $T ? $T : $F'
          - pattern-not-inside: 'typeof $T == "function" ? $T : $F'
          - pattern-not-inside: '"function" === typeof $T ? $T : $F'
          - pattern-not-inside: 'typeof $T === "function" ? $T : $F'
          - pattern-not-inside: '"function" != typeof $T && ($T = $F)'
          - pattern-not-inside: 'typeof $T != "function" && ($T = $F)'
          - pattern-not-inside: '"function" !== typeof $T && ($T = $F)'
          - pattern-not-inside: 'typeof $T !== "function" && ($T = $F)'
          # an old-engine Function.prototype.bind shim: `new F(a[0],a[1],…)` from constants
          - pattern-not: Function("...", "return new F(" + $R.join(",") + ")")
          - pattern-not: new Function("...", "return new F(" + $R.join(",") + ")")
      # setTimeout/setInterval only count when handed a *string* to evaluate.
      - pattern: setTimeout("..." + $Y, ...)
      - pattern: setTimeout($Y + "...", ...)
      - pattern: setTimeout(`...${$Y}...`, ...)
      - pattern: setInterval("..." + $Y, ...)
      - pattern: setInterval($Y + "...", ...)
      - pattern: setInterval(`...${$Y}...`, ...)

  - id: card-eval-config
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Evaluates a string built from the card's own dashboard configuration (e.g. to
      support ${...} templates). Only dashboard editors (HA admins) control that input,
      so this is mostly a risk if you paste card YAML from untrusted sources. Still
      eval: worth knowing about.
    metadata:
      sniff:
        title: Card evaluates templates from its own config
        severity: medium
        category: code_exec
        supersedes: [card-eval]
    pattern-sources:
      - pattern: $O.config
      - pattern: $O._config
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($ARG)
              - pattern: window.eval($ARG)
              - pattern: new Function(..., $ARG)
              - pattern: Function(..., $ARG)
              - patterns:
                  - pattern-either:
                      - pattern: $G.eval($ARG)
                      - pattern: $G["eval"]($ARG)
                      - pattern: new $G.Function(..., $ARG)
                      - pattern: $G.Function(..., $ARG)
                  - metavariable-regex:
                      metavariable: $G
                      regex: ^(window|globalThis|self|top|parent|frames)$
          - focus-metavariable: $ARG

  - id: card-remote-script
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Loads JavaScript from a remote URL at runtime. That code runs in your HA
      origin with your tokens, and it was never part of what got scanned.
    metadata:
      sniff: {title: Card loads remote code at runtime, severity: medium, category: code_exec}
    pattern-either:
      - pattern: import("=~/^(https?:)?\/\//")
      - pattern: importScripts("=~/^(https?:)?\/\//")
      # (0.15) a Web Worker started from a remote address
      - pattern: new Worker("=~/^(https?:)?\/\//", ...)
      - pattern: new SharedWorker("=~/^(https?:)?\/\//", ...)
      - patterns:
          - pattern-inside: |
              $S = document.createElement("script");
              ...
          - pattern-either:
              - pattern: $S.src = "=~/^(https?:)?\/\//"
              - pattern: $S.setAttribute("src", "=~/^(https?:)?\/\//")

  # `a<!--b` is rewritten to `a< !--b` in our copy before scanning (see normalize_js), so
  # this matches what was `<!--` in the original. Minifiers (terser, esbuild) never emit
  # it because classic scripts treat it as a comment; scanners do too, which is the trick.
  - id: card-html-comment-token
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Uses the HTML comment token `<!--` inside code. Many scanners treat it as a
      comment and skip the rest of the line, but HA loads cards as modules, where it is
      ordinary code (`a < !--b`). Barkley scanned the hidden part anyway; no normal
      code or minifier writes this.
    metadata:
      sniff: {title: Card hides code behind an HTML comment token, severity: medium, category: code_exec}
    pattern: $A < !--$B
