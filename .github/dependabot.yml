# Update pull requests for what this repository pins: the workflows' actions (pinned
# to commits) and the scanner's locked Python dependencies. The tools in the image
# (Semgrep, GuardDog, osv-scanner, uv) are pinned by hand in the Dockerfile, with
# checksums, and upgraded deliberately: a new Semgrep can change what the rules see.
# The security workflow's tools (Gitleaks, Hadolint, Checkov) are hand-pinned too.
# Cooldown: a release must be a week old before a pull request offers it, so a
# hijacked release has time to be noticed and pulled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
