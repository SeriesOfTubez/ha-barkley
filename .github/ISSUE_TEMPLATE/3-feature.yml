name: Feature request
description: An idea for something Barkley should do, check or show.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you'd want Barkley to handle it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Workarounds, other tools, or other ways Barkley could do it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rules and checks
        - Scoring
        - Panel / UI
        - Notifications and auto-sniff
        - Command line
        - Install and setup
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues and this isn't already requested.
          required: true
