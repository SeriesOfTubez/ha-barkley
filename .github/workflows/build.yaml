# Builds the app image for amd64 and aarch64 and publishes it to GHCR:
#   ghcr.io/<owner>/amd64-barkley:<version>, ghcr.io/<owner>/aarch64-barkley:<version>
#   ghcr.io/<owner>/barkley:<version>   (the multi-arch manifest config.yaml names)
#
# Runs when a GitHub release is published. The release tag must be the version in
# addon/sniff_test/config.yaml ("0.10.4" or "v0.10.4"): the Supervisor pulls
# <image>:<that version>, so a mismatch would publish an image nobody is offered.
# A version that is already published is never overwritten (skip-existing): everyone
# who installed 0.10.4 has the same bytes. "Run workflow" by hand only builds, as a
# check, unless push is ticked.
#
# The build context is the staged folder (scripts/stage_addon.py: the app's files plus
# the scanner's source, never tests or fixtures), the same folder a local install builds.
#
# Signing: Home Assistant's builder actions sign every image and the manifest with
# Cosign, keyless (the certificate names this repository's workflow). The base image's
# own signature is checked before the build. Actions are pinned to commits.
name: Build and publish the app image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: Publish the images (off = build only)
        type: boolean
        default: false

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: barkley
  BASE_IMAGE: ghcr.io/home-assistant/base-debian:trixie

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  init:
    name: Read the version
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      prefix: ${{ steps.version.outputs.prefix }}
      push: ${{ steps.version.outputs.push }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version, image name and release tag agree
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PUSH_INPUT: ${{ inputs.push }}
        run: |
          config=addon/sniff_test/config.yaml
          version="$(sed -n 's/^version: *"\{0,1\}\([^" ]*\)"\{0,1\} *$/\1/p' "${config}")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a version from ${config} (got '${version}')"
            exit 1
          fi
          # Registries refuse capitals; the owner's name may have them.
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image="$(sed -n 's/^image: *\([^ ]*\) *$/\1/p' "${config}")"
          if [[ "${image}" != "${prefix}/${IMAGE_NAME}" ]]; then
            echo "::error::${config} names '${image}', this workflow publishes '${prefix}/${IMAGE_NAME}'"
            exit 1
          fi
          push=false
          if [[ "${EVENT}" == "release" ]]; then
            if [[ "${TAG}" != "${version}" && "${TAG}" != "v${version}" ]]; then
              echo "::error::Release tag '${TAG}' is not the app version '${version}' in ${config}"
              exit 1
            fi
            push=true
          elif [[ "${PUSH_INPUT}" == "true" ]]; then
            push=true
          fi
          {
            echo "version=${version}"
            echo "prefix=${prefix}"
            echo "push=${push}"
          } >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ steps.version.outputs.prefix }}

  build:
    name: Build the ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the code
      id-token: write # Cosign's keyless signing (an OIDC token for this run)
      packages: write # push the image to GHCR
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage the app folder (the build context)
        run: python3 scripts/stage_addon.py

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: dist/addon/sniff_test
          cosign-base-verify: ${{ env.BASE_IMAGE }}
          cosign-base-identity: https://github.com/home-assistant/docker-base/.*
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: ${{ needs.init.outputs.push }}
          skip-existing: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish the multi-arch manifest
    needs: [init, build]
    if: needs.init.outputs.push == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Cosign's keyless signing
      packages: write # push the manifest to GHCR
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          registry-prefix: ${{ needs.init.outputs.prefix }}
          skip-existing: ${{ needs.init.outputs.version }}
