# The offline checks from the README's Development section, on every push and pull
# request. No secrets, read-only token. Semgrep is pinned to the version the image
# ships, so the rule tests run on the engine users get. The tests that need
# osv-scanner skips itself here; the network tests are opt-in.
#
# tests/fixtures and tests/rules hold deliberately malicious sample code. Nothing here
# runs it: the tests parse it, the same way the scanner does.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests and rule tests
    runs-on: ubuntu-24.04
    env:
      SEMGREP_VERSION: 1.185.0
      # the same override as the Dockerfile's SEMGREP_OVERRIDES (it says why)
      SEMGREP_OVERRIDES: mcp==1.30.0
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the project (locked) and Semgrep (wheels only)
        run: |
          uv sync --locked
          printf '%s\n' "${SEMGREP_OVERRIDES}" > "${RUNNER_TEMP}/semgrep-overrides.txt"
          uv tool install --no-build --overrides "${RUNNER_TEMP}/semgrep-overrides.txt" \
            "semgrep==${SEMGREP_VERSION}"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (offline)
        run: uv run pytest

      - name: Rule tests
        run: semgrep scan --test --config rules/ tests/rules/

      # (0.14.0) The second pass runs on its own (analyzers/semgrep.py says why), so its
      # rules are tested on their own too.
      - name: Rule tests (second pass)
        run: semgrep scan --test --config src/sniff_test/rules_const/ tests/rules_const/

      - name: The app folder stages
        run: uv run python scripts/stage_addon.py
