# Home Assistant app (add-on) manifest.
# Reference: https://contributors.home-assistant.io/apps/reference/configuration/
name: Sniff Test
version: "0.1.0"
slug: sniff_test
description: >-
  Sniffs Home Assistant Marketplace (HACS) integrations and cards for token theft,
  data exfiltration and supply-chain tricks before they get into the house.
arch:
  - aarch64
  - amd64
# The image's s6-overlay v3 must be PID 1.
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:dog-side
panel_title: Sniff Test
# Reads the installed HA version (GET /core/api/config) so dependencies resolve
# against the release the user actually runs. Nothing else is requested: no host
# network, no ports, no Supervisor role, no folders. Read-only access to the HA
# config folder (to scan installed custom_components/ and www/) comes with that
# feature, not before.
homeassistant_api: true
# HA constraints and package caches are re-downloadable: keep them out of backups.
backup_exclude:
  - "cache/*"
options:
  exposure: local
  jobs: 1
  github_token: ""
schema:
  exposure: list(local|public)
  jobs: int(1,4)
  github_token: password?
# Published multi-arch image (built with the repo root as context, see DOCS.md).
# Uncomment once the registry exists; without it the Supervisor would try to build
# from this folder alone, which doesn't contain the scanner's source.
# image: ghcr.io/OWNER/sniff-test
