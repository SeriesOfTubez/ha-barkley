# Home Assistant app (add-on) manifest.
# Reference: https://contributors.home-assistant.io/apps/reference/configuration/
name: Sniff Test
version: "0.5.0"
slug: sniff_test
description: >-
  Sniffs Home Assistant Marketplace (HACS) integrations and cards for token theft,
  data exfiltration and supply-chain tricks before they get into the house.
arch:
  - aarch64
  - amd64
# The image's s6-overlay v3 must be PID 1.
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:dog-side
panel_title: Sniff Test
# Three calls, nothing else (each fixed in code, see supervisor.py):
# - GET /core/api/config: the installed HA version, so dependencies resolve against
#   the release the user actually runs.
# - The Marketplace's `marketplace/repositories/list` (older HA: HACS's
#   `hacs/repositories/list`) over the Core websocket proxy: installed integrations and
#   cards with their installed and available versions.
# - POST /core/api/services/ai_task/generate_data?return_response: only when the user
#   clicks "Explain this app" with `ai_entity` set. It sends findings about a public
#   repo to the AI provider behind that entity; no HA data. Covered by the same
#   permission, so no new one is asked for.
# No host network, no ports, no Supervisor role, no folder access: the installed list
# comes from HACS, so the HA config folder (secrets.yaml, .storage/auth) stays unmapped.
homeassistant_api: true
# HA constraints and package caches are re-downloadable: keep them out of backups.
backup_exclude:
  - "cache/*"
options:
  exposure: local
  jobs: 1
  github_token: ""
  ai_entity: ""
schema:
  exposure: list(local|public)
  jobs: int(1,4)
  github_token: password?
  ai_entity: "match(^(ai_task\\.[a-z0-9_]+)?$)?"
# Published multi-arch image (built with the repo root as context, see DOCS.md).
# Uncomment once the registry exists; without it the Supervisor would try to build
# from this folder alone, which doesn't contain the scanner's source.
# image: ghcr.io/OWNER/sniff-test
