# Home Assistant app (add-on) manifest.
# Reference: https://contributors.home-assistant.io/apps/reference/configuration/
name: Barkley
version: "0.7.6"
slug: sniff_test
description: >-
  Barkley gives Home Assistant Marketplace (HACS) integrations and cards a security
  sniff test for token theft, data exfiltration and supply-chain tricks before they
  get into the house.
arch:
  - aarch64
  - amd64
# The image's s6-overlay v3 must be PID 1.
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:dog-side
panel_title: Barkley
# Four calls, nothing else (each fixed in code, see supervisor.py):
# - GET /core/api/config: the installed HA version, so dependencies resolve against
#   the release the user actually runs.
# - The Marketplace's `marketplace/repositories/list` (older HA: HACS's
#   `hacs/repositories/list`) over the Core websocket proxy: installed integrations and
#   cards with their installed and available versions.
# - POST /core/api/services/ai_task/generate_data?return_response: only when the user
#   clicks "Explain this app" with `ai_entity` set. It sends findings about a public
#   repo to the AI provider behind that entity; no HA data. With `ai_mode: deep`, a click
#   on "Explain in context" also sends up to 150 lines of that app's own code (public
#   on GitHub, captured at scan time), never anything from the HA config.
# - POST /core/api/template with one fixed template that returns only the ids and names
#   of ai_task entities, for the panel's AI dropdown (nothing else is read).
# - Auto-sniff: `marketplace/subscribe` for two fixed signals over a long-lived Core
#   websocket (an install that ended, an uninstall), then the list above again; one
#   persistent_notification.create per auto-sniffed install or update, and notify.<target>
#   when one is picked in the panel (GET /core/api/services is read once to offer the
#   notify targets; only their names are kept). GET /addons/self/info (allowed for every
#   app) gives the app's own slug for the "Open Barkley" link.
# All covered by this one permission, so no new one is asked for.
# No host network, no ports, no Supervisor role, no folder access: the installed list
# comes from HACS, so the HA config folder (secrets.yaml, .storage/auth) stays unmapped.
homeassistant_api: true
# HA constraints and package caches are re-downloadable: keep them out of backups.
backup_exclude:
  - "cache/*"
options:
  exposure: local
  jobs: 1
  parallel_scans: 2
  github_token: ""
  ai_entity: ""
  ai_mode: summary
  auto_scan: true
  notify_target: ""
schema:
  exposure: list(local|public)
  jobs: int(1,4)
  parallel_scans: int(1,4)
  github_token: password?
  ai_entity: "match(^(ai_task\\.[a-z0-9_]+)?$)?"
  ai_mode: list(summary|deep)?
  auto_scan: bool?
  notify_target: "match(^[a-z0-9_]{0,100}$)?"
# Published multi-arch image (built with the repo root as context, see DOCS.md).
# Uncomment once the registry exists; without it the Supervisor would try to build
# from this folder alone, which doesn't contain the scanner's source.
# image: ghcr.io/OWNER/sniff-test
