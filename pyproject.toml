[project]
name = "ha-sniff-test"
version = "0.10.1"
description = "🐕 Sniffs Home Assistant Marketplace (HACS) integrations and cards before they get into the house."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "jsbeautifier==2.0.3",
    "rich>=13.7",
]

[project.scripts]
sniff-test = "sniff_test.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sniff_test"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "sniff_test/rules"

[tool.ruff]
line-length = 100
target-version = "py313"
# Rule test targets and fixtures are deliberately "malicious" sample code.
extend-exclude = ["tests/rules", "tests/fixtures", "demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = [
    "S603",  # subprocess without shell: we invoke fixed scanner binaries with list args
    "S607",  # partial executable path: tool binaries are resolved via shutil.which
    "SIM905",  # word lists read better as "a b c".split()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108"]
# The panel's HTML/SVG templates: long markup literals and deliberate typography (– −).
"src/sniff_test/ui.py" = ["E501", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits GitHub/PyPI (deselect with -m 'not network')",
    "tools: requires external scanners (semgrep, osv-scanner, guarddog)",
]
addopts = "-m 'not network'"
